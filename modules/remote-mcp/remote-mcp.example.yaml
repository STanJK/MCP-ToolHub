version: 1

# Preferred layout: provider -> profile.
# Provider-level headers are inherited by every profile, which is useful when
# several fixed remote environments share one account-level credential.
providers:
  cloudbase:
    enabled: true

    headers:
      X-TencentCloud-SecretId:
        env: TOOLHUB_CLOUDBASE_SECRET_ID
      X-TencentCloud-SecretKey:
        env: TOOLHUB_CLOUDBASE_SECRET_KEY

    allow_tools:
      - '*'
    deny_tools: []

    profiles:
      sleep-record:
        enabled: true
        url: 'https://tcb-api.cloud.tencent.com/mcp/v1?env_id=replace-sleep-record-env-id'

      edu-pulse-dev:
        enabled: true
        url: 'https://tcb-api.cloud.tencent.com/mcp/v1?env_id=edu-pulse-dev-d4gsaerix60a4ea6f'

# Legacy flat server configs remain accepted for migration:
#
# servers:
#   legacy-server:
