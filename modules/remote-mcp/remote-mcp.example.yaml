version: 1

# One remote-mcp module may aggregate multiple named remote MCP servers.
# Server IDs are local static capability names and must match:
#   [a-z0-9][a-z0-9-]*
servers:
  sleeprecord-server:
    enabled: true
    url: 'https://sleep.example.com/mcp'

    # HTTPS is required by default. Set true only for a trusted LAN/dev endpoint.
    allow_insecure_http: false

    # Fixed request headers. Secret values should normally come from the ToolHub
    # process environment instead of being written directly into this file.
    headers:
      Authorization:
        env: TOOLHUB_SLEEPRECORD_TOKEN
        prefix: 'Bearer '

    # Explicit local trust policy for this server's upstream MCP tool catalog.
    allow_tools:
      - '*'
    deny_tools: []

  # Local JADX GUI MCP plugin (0xdad0/jadx-mcp).
  # Keep this bound to loopback; the plugin has no authentication layer.
  jadx:
    enabled: false
    url: 'http://127.0.0.1:8811/mcp'
    allow_insecure_http: true
    headers: {}
    allow_tools:
      - '*'
    deny_tools: []

  # another-server:
  #   enabled: false
  #   url: 'https://another.example.com/mcp'
