version: 1

defaults:
  timeout_ms: 900000
  max_output_kb: 1024

projects:
  example:
    description: Example project
    root: 'C:\Development\ExampleProject'

    operations:
      status:
        description: Show concise git status and branch
        program: git.exe
        args:
          - status
          - --short
          - --branch

      status-full:
        description: Show full git status
        program: git.exe
        args:
          - status

      git-diff:
        description: Show unstaged git diff
        program: git.exe
        args:
          - diff
          - --no-ext-diff

      git-diff-staged:
        description: Show staged git diff
        program: git.exe
        args:
          - diff
          - --cached
          - --no-ext-diff

      git-diff-stat:
        description: Show unstaged git diff summary
        program: git.exe
        args:
          - diff
          - --stat

      git-log:
        description: Show recent commit graph
        program: git.exe
        args:
          - log
          - --oneline
          - --decorate
          - --graph
          - --all
          - -n
          - '40'

      git-branch:
        description: Show local and remote branches
        program: git.exe
        args:
          - branch
          - --all
          - --verbose
          - --no-abbrev

      git-remotes:
        description: Show configured git remotes
        program: git.exe
        args:
          - remote
          - -v

      git-head:
        description: Show current HEAD commit
        program: git.exe
        args:
          - show
          - --no-patch
          - --decorate
          - --stat
          - --oneline
          - HEAD

      git-files:
        description: List tracked files
        program: git.exe
        args:
          - ls-files

      git-submodules:
        description: Show recursive submodule status
        program: git.exe
        args:
          - submodule
          - status
          - --recursive


      # Local mutation boundary:
      # - worktree + index changes are allowed
      # - no network operations
      # - no commit/ref/history mutations

      git-add-all:
        description: Stage all tracked and untracked worktree changes
        program: git.exe
        args:
          - add
          - -A

      git-add-update:
        description: Stage modifications and deletions of tracked files only
        program: git.exe
        args:
          - add
          - -u

      git-unstage-all:
        description: Unstage all staged changes while preserving the worktree
        program: git.exe
        args:
          - restore
          - --staged
          - .

      git-restore-all:
        description: Discard all unstaged tracked-file changes in the worktree
        program: git.exe
        args:
          - restore
          - .

      git-clean-preview:
        description: Preview deletion of untracked files and directories
        program: git.exe
        args:
          - clean
          - -nd

      git-clean-untracked:
        description: Delete untracked files and directories; ignored files are preserved
        program: git.exe
        args:
          - clean
          - -fd

      check:
        description: Cargo workspace check
        program: cargo.exe
        args:
          - check
          - --workspace

      build:
        description: Cargo workspace build
        program: cargo.exe
        args:
          - build
          - --workspace

      frontend-build:
        description: Build frontend from a project subdirectory
        cwd: app\gui
        program: npm.cmd
        args:
          - run
          - build
