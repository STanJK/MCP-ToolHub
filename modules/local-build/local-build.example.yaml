version: 1

defaults:
  timeout_ms: 900000
  max_output_kb: 1024

projects:
  example:
    description: Example project
    root: 'C:\Development\ExampleProject'

    operations:
      git-status:
        description: Show git status
        program: git.exe
        args:
          - status
          - --short
          - --branch

      git-pull:
        description: Fast-forward the current branch from its configured upstream
        program: git.exe
        args:
          - pull
          - --ff-only

      cargo-check:
        description: Cargo workspace check
        program: cargo.exe
        args:
          - check
          - --workspace

      cargo-build:
        description: Cargo workspace build
        program: cargo.exe
        args:
          - build
          - --workspace

      frontend-npm-build:
        description: Build frontend from a project subdirectory
        cwd: app\gui
        program: npm.cmd
        args:
          - run
          - build
