[package]
name = "mcp-toolhub-gui-host"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.34"
tauri = { version = "2.12.0", features = [] }

base64 = "0.22"
windows-sys = { version = ">=0.59, <=0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
